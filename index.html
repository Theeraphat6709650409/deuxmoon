<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deuxmoon Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

        <nav class="navbar">
        <div class="brand">
            <img src="EAA8607F-0D59-4525-A5EE-4E9736CABD0A.png" alt="Deuxmoon Logo" style="height: 95px; border-radius: 8px; cursor: pointer;" onclick="window.location.href='index.html'">
        </div>
        
        <div class="user-menu" id="menu-guest">
            <button class="btn-buy btn-netflix" style="padding: 8px 16px; width: auto;" onclick="openAuthModal()">เข้าสู่ระบบ</button>
        </div>

        <div class="user-menu" id="menu-logged-in" style="display: none;">
            <span id="display-email" style="font-size: 14px; color: var(--text-muted);"></span>
            <div class="wallet-badge">
                เครดิต: <span class="wallet-amount" id="credit-display">0.00</span> THB
            </div>
            <button class="btn-topup" onclick="toggleTopup()">เติมเงิน</button>
            
            <button class="btn-topup" style="background: var(--netflix-btn);" onclick="window.location.href='history.html'">ประวัติ</button>
            <button class="btn-buy" style="background: #333; padding: 8px 16px; width: auto;" onclick="logout()">ออก</button>
        </div>
    </nav>

    <div id="store-section" style="margin-top: 30px;">
        <h2 class="section-title" id="store-title">เลือกแอปที่ต้องการ</h2>
            
        <div id="app-grid" class="app-grid">
            </div>

        <div id="package-section" style="display: none;">
            <button class="btn-back" onclick="backToMainMenu()">← กลับไปหน้าเลือกแอป</button>
            <div id="package-container" class="product-container" style="margin-top: 20px;">
                </div>
        </div>
    </div>

    <div class="container topup-modal" id="topup-section">
        <h2>ระบบเติมเงินอัตโนมัติ</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">สแกน QR Code เพื่อเติมเครดิต</p>
        <img src="my-qr.jpg" alt="QR Code รับเงิน" style="width: 200px; height: 200px; margin: 0 auto 20px; border-radius: 10px; display: block; object-fit: cover;">
        <input type="file" id="slip-upload" style="margin-bottom: 15px; width: 100%;">
        <button class="btn-buy btn-disney" style="width: 100%;" onclick="uploadSlip()">ตรวจสอบสลิป</button>
        <button class="btn-buy btn-disabled" style="width: 100%; margin-top: 10px;" onclick="toggleTopup()">ยกเลิก</button>
    </div>

   <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <h3 class="modal-title" id="auth-title">เข้าสู่ระบบ</h3>
            
            <input type="email" id="auth-email" placeholder="username" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--dark-border); box-sizing: border-box;">
            <input type="password" id="auth-password" placeholder="รหัสผ่าน" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--dark-border); box-sizing: border-box;">
            
            <input type="text" id="auth-pin" placeholder="รหัส PIN 4 หลัก" maxlength="4" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 8px; background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--dark-border); box-sizing: border-box; display: none;">
            
            <button class="btn-buy btn-disney" id="btn-login" onclick="login()">เข้าสู่ระบบ</button>
            <button class="btn-buy btn-netflix" id="btn-register" onclick="register()" style="display: none;">ยืนยันสมัครสมาชิก</button>
            <button class="btn-buy" id="btn-reset" onclick="resetPassword()" style="display: none; background: #e67e22;">รีเซ็ตรหัสผ่านใหม่</button>
            
            <div style="margin-top: 15px; font-size: 14px; color: var(--text-muted); cursor: pointer;" onclick="toggleAuthMode()">
                <span id="auth-switch-text">ยังไม่มีบัญชี? กดที่นี่เพื่อสมัครสมาชิก</span>
            </div>
            
            <div style="margin-top: 10px; font-size: 14px; color: #ffb74d; cursor: pointer;" id="forgot-password-text" onclick="toggleResetMode()">
                ลืมรหัสผ่าน?
            </div>
            
            <button class="btn-buy" style="background: transparent; border: 1px solid #555; margin-top: 15px;" onclick="closeAuthModal()">ยกเลิก</button>
        </div>
    </div>

    <div id="receipt-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 class="modal-title">สั่งซื้อสำเร็จ!</h3>
            <div id="receipt-details" class="receipt-details">
            </div>
            <button class="btn-buy btn-disney" onclick="closeReceiptModal()" style="margin-top: 20px;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script src="script.js"></script>

    
</body>
</html>
