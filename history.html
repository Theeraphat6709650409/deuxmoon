<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการสั่งซื้อ - Deuxmoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background-image: url('4F36D6F4-6C48-4405-BDF3-E06B9EDDAEDF.png'); background-size: cover; background-attachment: fixed; background-position: center; margin: 0; color: white; font-family: 'Prompt', sans-serif;">

    <div class="navbar">
        <div class="brand">
            <img src="EAA8607F-0D59-4525-A5EE-4E9736CABD0A.png" alt="Deuxmoon Logo" style="height: 60px; border-radius: 8px; cursor: pointer;" onclick="window.location.href='index.html'">
        </div>
    </div>

    <div class="history-container">
        <button class="btn-back" onclick="window.location.href='index.html'" style="margin-bottom: 20px;">← กลับหน้าหลัก</button>
        <h2 class="section-title">ประวัติการสั่งซื้อของคุณ</h2>
        
        <div id="history-list">
            <div style="text-align: center; padding: 20px; color: #888;">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <div id="details-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 9999;">
        <div style="background: #1a1a2e; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid #00dc5a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;">
            <h2 style="color: #00dc5a; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; text-align: center;">รายละเอียดบัญชี</h2>
            
            <div id="details-body" style="text-align: left; font-size: 15px; line-height: 1.8; margin-top: 15px; color: white;">
            </div>

            <div id="details-buttons" style="margin-top: 20px; text-align: center;">
                <!-- ปุ่มจะถูกแทรกเข้ามาตรงนี้อัตโนมัติ -->
            </div>

            <button onclick="closeDetails()" style="margin-top: 20px; background: #333; color: white; border: 1px solid #555; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 15px;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        const API_URL = "https://deuxmoon-api.onrender.com";
        let historyData = [];
        let activeItemIndex = null; 

        function showToast(icon, title) {
            Swal.fire({
                toast: true, position: 'top-end', icon: icon, title: title,
                showConfirmButton: false, timer: 2000, timerProgressBar: true,
                background: '#1a1a2e', color: '#fff'
            });
        }

        async function loadHistory() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            
            if (!token || !userStr) {
                Swal.fire({
                    icon: 'warning', title: 'กรุณาเข้าสู่ระบบ',
                    text: 'คุณต้องเข้าสู่ระบบก่อนดูประวัติการสั่งซื้อ',
                    background: '#1a1a2e', color: '#fff', confirmButtonColor: '#00dc5a'
                }).then(() => {
                    window.location.href = 'index.html';
                });
                return;
            }

            const user = JSON.parse(userStr);
            const userEmail = user.email.split('@')[0];

            try {
                const response = await fetch(`${API_URL}/history`, {
                    method: 'GET', headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();

                if (result.status === 'success') {
                    historyData = result.data;
                    renderHistory(historyData, userEmail);
                } else {
                    document.getElementById('history-list').innerHTML = `<p style="color: #ffb3b3; text-align: center;">เกิดข้อผิดพลาด: ${result.message}</p>`;
                }
            } catch (error) {
                document.getElementById('history-list').innerHTML = `<p style="color: #ffb3b3; text-align: center;">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</p>`;
            }
        }

        function formatThaiDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            const d = date.getDate();
            const m = months[date.getMonth()];
            const y = date.getFullYear() + 543;
            const time = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            return `${d} ${m} ${y} เวลา ${time} น.`;
        }

       // --- กลับมาใช้ created_at และ expire_date แต่แก้สูตรคำนวณให้แม่นยำ ---
        function getAppInfo(platform, created_at, expire_date) {
            platform = platform || 'unknown'; 
            const apps = {
                'netflix': { name: 'NETFLIX', logo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Netflix_2015_N_logo.svg' },
                'disney': { name: 'DISNEY+', logo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Disney%2B_logo.svg' },
                'iqiyi': { name: 'iQIYI', logo: 'https://play-lh.googleusercontent.com/L40FnQ8nF8zRtUdALz9b23JirsxYA5-0_fkRUlFBMymud09ctBCFrNui4l-ES_V6Uw=w1024' },
                'wetv': { name: 'WeTV', logo: 'https://commons.wikimedia.org/wiki/Special:FilePath/WeTV_logo.svg' },
                'viu': { name: 'Viu', logo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Viu_logo.svg' },
                'prime': { name: 'Prime Video', logo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Amazon_Prime_Video_logo.svg' },
                'hbo': { name: 'HBO Max', logo: 'https://commons.wikimedia.org/wiki/Special:FilePath/Max_logo.svg' },
                'oned': { name: 'OneD', logo: 'https://www.ais.th/content/ais/th/th_th/consumers/entertainment/streaming-app/one-d/_jcr_content/root/container_1816311984/aiscontainer/columncontrol_copy_c/content1/image.coreimg.png/1742182598629/logo-oned-b.png' },
                'ch3': { name: 'Ch3 Plus', logo: 'https://assets.ch3plus.com/ch3plus_logo.png' },
                'bilibili': { name: 'Bilibili', logo: 'https://img.icons8.com/color/1200/bilibili.jpg' },
                'spotify': { name: 'Spotify', logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Spotify_icon.svg/1280px-Spotify_icon.svg.png' },
                'canva': { name: 'Canva', logo: 'https://www.edigitalagency.com.au/wp-content/uploads/Canva-logo-PNG-large-size.png' },
                'monomax': { name: 'Mono Max', logo: 'https://img.monomax.me/9RN09HpT5JJlM0gDpIB3EUYJFgg=/www.monomax.me/assets/monomax/images/maxplay/logo-monomax-sm.png' },
                'trueid': { name: 'TrueID+', logo: 'https://img.monomax.me/9RN09HpT5JJlM0gDpIB3EUYJFgg=/www.monomax.me/assets/monomax/images/maxplay/logo-monomax-sm.png' },
                'chatgpt': { name: 'ChatGPT+', logo: 'https://commons.wikimedia.org/wiki/Special:FilePath/ChatGPT_logo.svg' },
                'youtube': { name: 'YouTube Premium', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg' }
            };

            let baseApp = platform;
            let subText = "แพ็กเกจมาตรฐาน";
            if (baseApp === 'hbo') subText = 'Ultimate';

            if (platform.includes('_')) {
                const parts = platform.split('_');
                baseApp = parts[0];
                const type = parts[1];
                
                if (type === 'mobile') subText = 'จอส่วนตัว (มือถือ)';
                else if (type === 'tv') subText = 'จอส่วนตัว (ทีวี)';
                else if (type === 'private') subText = 'บัญชีส่วนตัว';
                else if (type === 'share2') subText = 'หาร 2 ไม่ชน';
                else if (type === 'share3') subText = 'หาร 3 ชนน้อย';
                else if (type === 'share4') subText = 'หาร 4';
                else if (type === 'share5') subText = 'หาร 5';
                else if (type === 'renew') subText = 'ต่อเมลเดิม';
                else if (type === 'store') subText = 'เมลร้าน (ไม่ต่ออายุ)';
                // --- เพิ่มคำแปลของแพ็กเกจใหม่ ---
                else if (type === 'customer') subText = 'เมลลูกค้า (ไม่ต่ออายุ)';
                else if (type === 'premprivate') subText = 'Premium (บัญชีส่วนตัว)';
                else if (type === 'premshare4') subText = 'Premium (หาร 4)';
                else if (type === 'sport') subText = 'แพ็กเกจดูบอล';
            }

            let durationText = "";
            if (created_at && expire_date) {
                // เปลี่ยนมาใช้ Math.ceil ปัดเศษขึ้นเสมอ
                let days = Math.ceil((new Date(expire_date) - new Date(created_at)) / (1000 * 60 * 60 * 24));
                
                // บังคับตบเข้าเลข 7 และ 30 เพื่อป้องกันเศษชั่วโมง
                if (days >= 25) durationText = " 30 วัน";
                else if (days >= 4 && days <= 10) durationText = " 7 วัน";
                else if (days >= 1 && days <= 3) durationText = " 1 วัน";
                else durationText = ` ${days} วัน`;
            }

            return {
                name: (apps[baseApp] ? apps[baseApp].name : platform.toUpperCase()) + durationText,
                logo: apps[baseApp] ? apps[baseApp].logo : 'https://ui-avatars.com/api/?name=' + platform,
                subText: subText
            };
        }

        function renderHistory(data, username) {
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '';

            if (data.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #888; background: var(--dark-glass); border-radius: 12px;">ยังไม่มีประวัติการสั่งซื้อครับ</div>';
                return;
            }

            const initial = username.charAt(0).toUpperCase();

            data.forEach((item, index) => {
                // ส่ง created_at และ expire_date เข้าไปคำนวณเหมือนเดิม
                const appInfo = getAppInfo(item.platform, item.created_at, item.expire_date);
                const dateStr = formatThaiDate(item.created_at);
                const refId = item.id ? String(item.id).substring(0, 8) : '000' + index;
                
                const warrantyBadge = item.has_warranty ? `<span style="color: #111; background: #00dc5a; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: bold; vertical-align: middle;">มีประกัน</span>` : '';

                listDiv.innerHTML += `
                    <div class="history-card">
                        <div class="history-header">
                            <div class="user-badge">
                                <div class="avatar">${initial}</div>
                                <span style="color: #e0e0e0; font-weight: 500;">${username}</span>
                            </div>
                            <div style="color: #666; font-size: 11px;">Ref: ${refId}</div>
                        </div>
                        <div class="history-body">
                            <img src="${appInfo.logo}" class="history-logo" alt="logo">
                            <div class="history-info">
                                <div class="history-title">${appInfo.name} ${warrantyBadge}</div>
                                <div class="history-sub">${appInfo.subText}</div>
                            </div>
                            <button class="btn-view-details" onclick="viewDetails(${index})">👁 ดูข้อมูล</button>
                        </div>
                        <div class="history-footer">
                            <span>🕒 ${dateStr}</span>
                        </div>
                    </div>
                `;
            });
        }

        function viewDetails(index) {
            activeItemIndex = index; 
            const item = historyData[index];
            if (!item) return;

            const appInfo = getAppInfo(item.platform, item.created_at, item.expire_date);
            const displayName = appInfo.name;
            
            let displayExpire = item.expire_date || '-';
            if (displayExpire !== '-') {
                let dateParts = displayExpire.split(' ');
                let d = dateParts[0].split('-'); 
                if (d.length === 3) {
                    let timeStr = dateParts[1] ? ' ' + dateParts[1] : '';
                    displayExpire = `EXP ${d[2]}-${d[1]}-${d[0]}${timeStr}`;
                }
            }

            let receiptHtml = `
                <div style="margin-bottom: 8px;"><span style="color:#888;">แพลตฟอร์ม:</span> <strong style="color:#fff;">${displayName}</strong></div>
                ${item.has_warranty ? `<div style="color: #00dc5a; font-weight: bold; margin-bottom: 8px; padding: 5px; background: rgba(0, 220, 90, 0.1); border-radius: 4px;">✅ สินค้านี้มีประกันเคลมบัญชี</div>` : ''}
                <div style="margin-bottom: 8px;"><span style="color:#888;">บัญชี (ล็อกอิน):</span> <strong style="color:#fff;">${item.account_login || '-'}</strong></div>
            `;
            if (item.account_password) receiptHtml += `<div style="margin-bottom: 8px;"><span style="color:#888;">รหัสผ่าน:</span> <strong style="color:#00dc5a;">${item.account_password}</strong></div>`;
            receiptHtml += `<div style="margin-bottom: 8px;"><span style="color:#888;">เข้าใช้งานจอ:</span> <strong style="color:#fff;">${item.profile_name || '-'}</strong></div>`;
            if (item.pin_code) receiptHtml += `<div style="margin-bottom: 8px;"><span style="color:#888;">รหัสเข้าจอ (PIN):</span> <strong style="color:#ffb74d;">${item.pin_code}</strong></div>`;
            receiptHtml += `<div style="margin-bottom: 8px;"><span style="color:#888;">วันหมดอายุ:</span> <strong style="color:#ff4d4d;">${displayExpire}</strong></div>`;

            // --- เพิ่มคำแนะนำเฉพาะ DISNEY+ ในหน้าประวัติ ---
            if (item.platform.includes('disney')) {
                receiptHtml += `
                <div style="margin-top: 15px; margin-bottom: 15px; padding: 15px; background: rgba(0, 168, 225, 0.1); border-left: 4px solid #00a8e1; border-radius: 4px; font-size: 13px; line-height: 1.6; text-align: left; color: #d6ebff;">
                    <strong style="color: #00a8e1; font-size: 14px;">✨ วิธีเข้าสู่ระบบ DISNEY+ (ดึง OTP ด้วยตัวเอง)</strong><br><br>
                    <b>ขั้นตอนที่ 1:</b> นำ <b>เบอร์โทรศัพท์</b> (จากช่องล็อกอินด้านบน) ไปกรอกในแอปหรือเว็บ Disney+ เพื่อส่งคำขอรับรหัส OTP<br><br>
                    <b>ขั้นตอนที่ 2:</b> เข้าไปที่ <a href="https://script.google.com/macros/s/AKfycbwuCoU1EvLlxuAZxWQeqg4gh5Ut2_130j-yHRL3TjPEr7v4kkAyIc-IyFIrJYHaxQiL/exec?authuser=0" target="_blank" style="color:#ffb74d; text-decoration:underline; font-weight:bold;">เว็บดึงรหัส OTP (คลิกลิงก์นี้)</a> 
                    แล้วนำ <b>อีเมล</b> (ในช่องรหัสผ่าน) และ <b>รหัส PIN(ในช่องรหัสเข้าจอ)</b> ไปกรอกเพื่อดึงรหัส<br><br>
                    <b>ขั้นตอนที่ 3:</b> นำรหัส OTP 4 หลักที่ได้จากหน้าเว็บ กลับไปกรอกในแอป Disney+ เพื่อเริ่มรับชมได้เลยครับ 🍿🎉
                </div>
                `;
            }

            let buttonsHtml = '';
            if (item.has_warranty) {
                const contactLink = "https://lin.ee/9DAHkG0"; 
                buttonsHtml += `
                    <button onclick="window.open('${contactLink}', '_blank')" style="background: #ff4d4d; color: white; border: none; padding: 11px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 10px; transition: 0.2s; box-shadow: 0 4px 10px rgba(255, 77, 77, 0.2);">🛠 แจ้งเคลมบัญชี (ติดต่อADMIN)</button>
                `;
            }

            buttonsHtml += `
                <button onclick="copyAll()" style="background: #00dc5a; color: white; border: none; padding: 11px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 10px; transition: 0.2s;">📋 คัดลอกข้อมูลทั้งหมด</button>
                <div style="display: table; width: 100%; border-collapse: separate; border-spacing: 6px 0;">
                    <div style="display: table-cell; width: 50%;">
                        <button onclick="copyLogin()" style="background: rgba(255,255,255,0.08); color: white; border: 1px solid #555; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 13px;">👤 คัดลอกบัญชี</button>
                    </div>
                    <div style="display: table-cell; width: 50%;">
                        <button onclick="copyPassword()" style="background: rgba(255,255,255,0.08); color: white; border: 1px solid #555; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 13px;">🔑 คัดลอกรหัสผ่าน</button>
                    </div>
                </div>
            `;

            document.getElementById('details-body').innerHTML = receiptHtml;
            document.getElementById('details-buttons').innerHTML = buttonsHtml;
            document.getElementById('details-modal').style.display = 'flex';
        }

        function closeDetails() {
            document.getElementById('details-modal').style.display = 'none';
        }

        function executeCopy(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('success', 'คัดลอกข้อมูลสำเร็จ!');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('success', 'คัดลอกข้อมูลสำเร็จ!');
            } catch (err) {
                showToast('error', 'คัดลอกล้มเหลว');
            }
            document.body.removeChild(textArea);
        }

        function copyLogin() {
            const item = historyData[activeItemIndex];
            if (item && item.account_login) executeCopy(item.account_login);
        }

        function copyPassword() {
            const item = historyData[activeItemIndex];
            if (item && item.account_password) executeCopy(item.account_password);
        }

        function copyAll() {
            const item = historyData[activeItemIndex];
            if (!item) return;

            const appInfo = getAppInfo(item.platform, item.created_at, item.expire_date);
            const displayName = appInfo.name;
            
            let displayExpire = item.expire_date || '-';
            if (displayExpire !== '-') {
                let dateParts = displayExpire.split(' ');
                let d = dateParts[0].split('-'); 
                if (d.length === 3) {
                    let timeStr = dateParts[1] ? ' ' + dateParts[1] : '';
                    displayExpire = `EXP ${d[2]}-${d[1]}-${d[0]}${timeStr}`;
                }
            }

            let textOutput = `Platform: ${displayName}\n`;
            if (item.has_warranty) textOutput += `✅ สินค้านี้มีประกันเคลมบัญชี\n`;
            textOutput += `Account (ล็อกอิน): ${item.account_login || '-'}\n`;
            if (item.account_password) textOutput += `รหัสผ่าน: ${item.account_password}\n`;
            textOutput += `Profile: ${item.profile_name || '-'}\n`;
            if (item.pin_code) textOutput += `รหัสเข้าจอ (PIN): ${item.pin_code}\n`;
            textOutput += `Expire: ${displayExpire}\n\n`;
            
            // --- แนบข้อมูลวิธีเข้าสู่ระบบเมื่อคัดลอกข้อความ ---
            if (item.platform.includes('disney')) {
                textOutput += `✨ วิธีเข้าสู่ระบบ DISNEY+ (ดึง OTP ด้วยตัวเอง) ✨\n`;
                textOutput += `1. นำ "เบอร์โทรศัพท์" (ในช่องล็อกอิน) ไปกรอกในแอป Disney+ เพื่อขอรับ OTP\n`;
                textOutput += `2. เข้าไปที่เว็บดึงรหัส: https://script.google.com/macros/s/AKfycbwuCoU1EvLlxuAZxWQeqg4gh5Ut2_130j-yHRL3TjPEr7v4kkAyIc-IyFIrJYHaxQiL/exec?authuser=0\n`;
                textOutput += `   (นำ "อีเมล" ในช่องรหัสผ่าน และ "รหัส PIN(ในช่องรหัสเข้าจอ)" ไปกรอกเพื่อดึงรหัส)\n`;
                textOutput += `3. นำรหัส OTP 4 หลักที่ได้จากเว็บ กลับไปกรอกใน Disney+ เพื่อเริ่มรับชมได้เลยครับ 🍿🎉\n\n`;
            }
            // --- เรียกใช้ กฎการใช้งานอัตโนมัติ (Text Mode) ---
            textOutput += getAppRules(item.platform, false);
    
            executeCopy(textOutput);
        }

        function getAppRules(platform, isHtml = false) {
            let rulesText = "";
